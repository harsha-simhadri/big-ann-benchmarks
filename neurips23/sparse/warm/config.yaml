sparse-small:
  warm:
    docker-tag: neurips23-sparse-warm
    module: neurips23.sparse.warm.warm
    constructor: Warm
    base-args: ["@metric"]
    run-groups:
      base:
        args: |
          [{"block_fraction": 0.25, "summary_coords": 256, "sketch_len": 40}]
        query-args: |
          [
          {"query_cut": 5, "heap_factor": 1.08, "residual": 0.12, "seed": 2, "tail": 0.25, "col_cut": 0.08, "batch": 16}
          ]
