random-xs:
  warm:
    docker-tag: neurips23-streaming-warm
    module: neurips23.streaming.warm.warm
    constructor: Warm
    base-args: ["@metric"]
    run-groups:
      base:
        args: |
          [{"R":32, "L":64, "alpha":1.0, "T":8}]
        query-args: |
          [{"ef":64}]
random-xs-clustered:
  warm:
    docker-tag: neurips23-streaming-warm
    module: neurips23.streaming.warm.warm
    constructor: Warm
    base-args: ["@metric"]
    run-groups:
      base:
        args: |
          [{"R":32, "L":64, "alpha":1.0, "T":8}]
        query-args: |
          [{"ef":64}]
msturing-10M-clustered:
  warm:
    docker-tag: neurips23-streaming-warm
    module: neurips23.streaming.warm.warm
    constructor: Warm
    base-args: ["@metric"]
    run-groups:
      base:
        args: |
          [{"R":32, "L":64, "alpha":1.0, "T":8, "merge":true, "delta_ratio":1.0, "deleted_ratio":0.3, "rebuild_after":3.0}]
        query-args: |
          [{"ef":512}]
msturing-30M-clustered:
  warm:
    docker-tag: neurips23-streaming-warm
    module: neurips23.streaming.warm.warm
    constructor: Warm
    base-args: ["@metric"]
    run-groups:
      base:
        args: |
          [{"mode":"partition", "lists":5000, "train_at":1000000, "reorder":1000, "T":8}]
        query-args: |
          [{"nprobe":650}]
