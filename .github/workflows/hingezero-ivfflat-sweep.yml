name: HingeZero OpenAI-100K IVF-Flat full-corpus comparison
on:
  push:
    branches:
      - t2/hingezero-full-v2
    paths:
      - .github/workflows/hingezero-ivfflat-sweep.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ivfflat:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark compiler and requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ libgomp1
          python -m pip install --upgrade pip
          python -m pip install -r requirements_py3.12.txt faiss-cpu==1.12.0 requests==2.32.3
      - name: Validate script and report CPU resources
        run: |
          nproc
          python -m py_compile benchmark/algorithms/hingezero_cpp_v3/ivfflat.py run_hingezero_ivfflat_sweep.py
      - name: Download official OpenAI-100K reference dataset
        run: python -u create_dataset.py --dataset openai-100K
      - name: Run 20,000-query full-corpus IVF-Flat benchmarks
        run: python -u run_hingezero_ivfflat_sweep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hingezero-ivfflat-full-corpus-scores
          path: |
            results/hz_ivfflat_sweep/
            results/openai-100K/
          if-no-files-found: warn
